name: Synchronize drift issue description

on:
  issue_comment:
    types:
      - created

permissions:
  issues: write

jobs:
  sync-issue:
    if: |
      !github.event.issue.pull_request && startsWith(github.event.issue.title, 'Terraform Drift (') && endsWith(github.event.issue.title, ')') && github.actor == 'shimosyan'
    uses: shimosyan/.github/.github/workflows/wc-sync-drift-issue-description.yaml@d2c775546e84981c2b238f9a7fe69a7eae74cb37 # main
